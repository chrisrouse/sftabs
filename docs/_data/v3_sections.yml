# Sections of the v3 documentation.
#
# Drives both the home-page tiles and the header nav, so a new page is added
# here once rather than in two places.
#
# `ready: false` renders the tile greyed out and unclickable and keeps the item
# out of the nav — the v3 docs are being written while v3 is in store review,
# and a tile that 404s is worse than one that says it is not written yet.
# Flip it to true in the same commit that adds the page.

- title: Installation
  url: /v3/installation
  icon: bi-download
  blurb: Install on Chrome, Edge or Firefox, or load the release build by hand.
  ready: true

