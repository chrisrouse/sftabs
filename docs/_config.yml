title: SF Tabs
description: Customize your Salesforce Setup menu with quick-access tabs
baseurl: "/sftabs"
url: "https://chrisrouse.github.io"

# Theme settings
theme: null

# v3 is the primary documentation: its pages live at the site root and the v3
# layout is what `/` serves. The v2 pages are retained under /v2/ for anyone
# following an old link, but nothing navigates to them.

# Version shown in the v3 layout's header badge and footer. The v2 layout
# hardcodes 2.1.1 at default.html:46; this exists so the v3 side has one place.
v3_version: "3.0.2"

# The superseded version, named in the notice on the retained /v2/ pages.
v2_version: "2.1.1"

# GitHub
github:
  repository_url: https://github.com/chrisrouse/sftabs
  issues_url: https://github.com/chrisrouse/sftabs/issues

# jekyll-redirect-from serves the former /v3/* URLs, which are now the root
# pages. It ships in the github-pages gem and is on the Pages plugin allowlist,
# so it runs under actions/jekyll-build-pages without any extra setup.
plugins:
  - jekyll-redirect-from

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
