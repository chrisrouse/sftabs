title: SF Tabs
description: Customize your Salesforce Setup menu with quick-access tabs
baseurl: "/sftabs"
url: "https://chrisrouse.github.io"

# Theme settings
theme: null

# Version shown in the v3 layout's header badge and footer. The v2 layout
# hardcodes 2.1.1 at default.html:46; this exists so the v3 side has one place.
v3_version: "3.0.0"

# The version the stores are still serving, named in the review notice.
v2_version: "2.1.1"

# Shows the "in review" banner at the top of every v3 page. Set to false the
# day 3.0 is live in both stores — that is the whole switch.
v3_in_review: true

# Brand colors
brand_color: "#288aff"
brand_color_dark: "#1a6ee6"

# Navigation
navigation:
  - title: Home
    url: /
  - title: Installation
    url: /installation
  - title: User Guide
    url: /getting-started
  - title: Configuration
    url: /configuration

# GitHub
github:
  repository_url: https://github.com/chrisrouse/sftabs
  issues_url: https://github.com/chrisrouse/sftabs/issues

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
